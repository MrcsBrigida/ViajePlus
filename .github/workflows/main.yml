name: ViajePlus - CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  RELEASE_NAME: viajeplus
  CLUSTER_NAME: viajeplus

jobs:
  # ---------------------------------------------------------------
  # CI: testes automatizados
  # ---------------------------------------------------------------
  test:
    name: Testes automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes
        run: pytest -v

  # ---------------------------------------------------------------
  # CI: build da imagem Docker e publicação no GHCR
  # ---------------------------------------------------------------
  build-and-push:
    name: Construir e publicar imagem
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ---------------------------------------------------------------
  # CD: deploy automático no Kubernetes (Kind) com Helm
  # ---------------------------------------------------------------
  deploy:
    name: Deploy no Kubernetes (Kind + Helm)
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Definir imagem e tag desta versão
        run: |
          # O nome da imagem no registry precisa estar em minúsculas
          echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          # Mesma tag curta (sha-xxxxxxx) gerada pelo job anterior
          echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Criar cluster Kubernetes (Kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          config: k8s/kind-config.yaml

      - name: Criar credencial para baixar a imagem do GHCR
        run: |
          kubectl create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}"

      - name: Validar o chart Helm
        run: |
          helm lint ./helm/viajeplus
          helm template ${{ env.RELEASE_NAME }} ./helm/viajeplus > /dev/null

      - name: Publicar nova versão com Helm
        run: |
          helm upgrade --install ${{ env.RELEASE_NAME }} ./helm/viajeplus \
            --set image.repository="${IMAGE_REPO}" \
            --set image.tag="${IMAGE_TAG}" \
            --set image.pullPolicy=IfNotPresent \
            --set "imagePullSecrets[0].name=ghcr-pull" \
            --wait --timeout 3m

      - name: Teste de fumaça (/health)
        run: |
          kubectl port-forward svc/${{ env.RELEASE_NAME }}-viajeplus 8080:5000 &
          PF_PID=$!
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/health; then
              echo
              kill $PF_PID
              exit 0
            fi
            sleep 2
          done
          kill $PF_PID
          echo "Aplicação não respondeu em /health"
          exit 1

      - name: Estado do cluster (use este log para o print)
        if: always()
        run: |
          kubectl get pods,svc -o wide
          helm list
          kubectl describe pods -l app=viajeplus | tail -40 || true

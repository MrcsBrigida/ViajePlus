
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-viajeplus
spec:
  type: {{ .Values.service.type }}
  selector:
    app: viajeplus
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      nodePort: {{ .Values.service.nodePort }}
      protocol: TCP

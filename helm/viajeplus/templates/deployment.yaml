
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-viajeplus
  labels:
    app: viajeplus
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: viajeplus
  template:
    metadata:
      labels:
        app: viajeplus
    spec:
      containers:
        - name: viajeplus
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 5000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
